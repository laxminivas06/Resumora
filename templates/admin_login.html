<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0">
    <title>Admin Login – Resumora</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <style>
        :root {
            --primary: #0f172a;
            --primary-hover: #1e293b;
            --accent: #4f46e5;
            --bg-page: #f8fafc;
            --card-bg: #ffffff;
            --text-main: #0f172a;
            --text-muted: #64748b;
            --border-color: #e2e8f0;
            --danger-bg: #fee2e2;
            --danger-text: #b91c1c;
            --success-bg: #dcfce7;
            --success-text: #15803d;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-page);
            color: var(--text-main);
            min-height: 100vh;
            min-height: 100dvh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1rem;
            overflow-x: hidden;
        }

        .login-card {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05), 0 8px 10px -6px rgba(0, 0, 0, 0.03);
            width: 100%;
            max-width: 420px;
            padding: 2.25rem 2rem;
            transition: all 0.2s ease;
        }

        .login-brand {
            text-align: center;
            margin-bottom: 2rem;
        }

        .brand-icon {
            width: 52px;
            height: 52px;
            background: linear-gradient(135deg, #0f172a 0%, #334155 100%);
            color: white;
            border-radius: 12px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-size: 1.5rem;
            margin-bottom: 1rem;
            box-shadow: 0 4px 12px rgba(15, 23, 42, 0.2);
        }

        .login-brand h1 {
            font-size: 1.45rem;
            font-weight: 800;
            color: var(--text-main);
            letter-spacing: -0.5px;
            margin-bottom: 0.35rem;
        }

        .login-brand p {
            color: var(--text-muted);
            font-size: 0.88rem;
            line-height: 1.4;
        }

        .flash-messages {
            margin-bottom: 1.5rem;
        }

        .alert-box {
            padding: 0.8rem 1rem;
            border-radius: 8px;
            font-size: 0.86rem;
            display: flex;
            align-items: center;
            gap: 0.6rem;
            margin-bottom: 0.75rem;
            line-height: 1.4;
        }

        .alert-box.error {
            background-color: var(--danger-bg);
            color: var(--danger-text);
            border: 1px solid #fecaca;
        }

        .alert-box.success {
            background-color: var(--success-bg);
            color: var(--success-text);
            border: 1px solid #bbf7d0;
        }

        .form-group {
            margin-bottom: 1.25rem;
        }

        .form-group label {
            display: block;
            margin-bottom: 0.45rem;
            font-size: 0.84rem;
            font-weight: 600;
            color: #334155;
        }

        .input-wrapper {
            position: relative;
            display: flex;
            align-items: center;
        }

        .input-wrapper i.prefix-icon {
            position: absolute;
            left: 0.85rem;
            color: var(--text-muted);
            font-size: 1rem;
            pointer-events: none;
        }

        .form-control {
            width: 100%;
            padding: 0.75rem 0.85rem 0.75rem 2.4rem;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            font-size: 16px; /* Prevents auto-zoom on iOS */
            color: var(--text-main);
            background: #fff;
            transition: all 0.15s ease-in-out;
            outline: none;
        }

        .form-control:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(15, 23, 42, 0.08);
        }

        .form-control::placeholder {
            color: #94a3b8;
            font-size: 0.9rem;
        }

        .btn-submit {
            width: 100%;
            padding: 0.85rem;
            background: var(--primary);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 0.95rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
            margin-top: 0.5rem;
            min-height: 46px;
        }

        .btn-submit:hover {
            background: var(--primary-hover);
            transform: translateY(-1px);
        }

        .btn-submit:active {
            transform: translateY(0);
        }

        .login-footer {
            margin-top: 1.75rem;
            text-align: center;
            border-top: 1px solid var(--border-color);
            padding-top: 1.25rem;
        }

        .back-link {
            color: var(--text-muted);
            text-decoration: none;
            font-size: 0.85rem;
            font-weight: 500;
            display: inline-flex;
            align-items: center;
            gap: 0.4rem;
            transition: color 0.15s;
        }

        .back-link:hover {
            color: var(--primary);
            text-decoration: underline;
        }

        .security-badge {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.4rem;
            font-size: 0.74rem;
            color: #94a3b8;
            margin-top: 1.25rem;
        }

        /* Mobile specific adjustments */
        @media (max-width: 480px) {
            .login-card {
                padding: 1.75rem 1.25rem;
                border-radius: 14px;
            }
            .login-brand h1 {
                font-size: 1.3rem;
            }
        }
    </style>
</head>
<body>
    <div class="login-card">
        <div class="login-brand">
            <div class="brand-icon">
                <i class="bi bi-shield-lock"></i>
            </div>
            <h1>Administrator Access</h1>
            <p>Log in with your authorized email address</p>
        </div>

        {% with messages = get_flashed_messages(with_categories=true) %}
            {% if messages %}
                <div class="flash-messages">
                    {% for category, message in messages %}
                        <div class="alert-box {{ 'error' if category == 'error' else 'success' }}">
                            <i class="bi {{ 'bi-exclamation-triangle-fill' if category == 'error' else 'bi-check-circle-fill' }}"></i>
                            <span>{{ message }}</span>
                        </div>
                    {% endfor %}
                </div>
            {% endif %}
        {% endwith %}

        <form action="{{ url_for('admin_login') }}" method="POST">
            <div class="form-group">
                <label for="email">Authorized Email Address</label>
                <div class="input-wrapper">
                    <i class="bi bi-envelope prefix-icon"></i>
                    <input type="email" id="email" name="email" class="form-control"
                           placeholder="admin@example.com" required autocomplete="email" autofocus>
                </div>
            </div>

            <div class="form-group">
                <label for="password">Administrator Password</label>
                <div class="input-wrapper">
                    <i class="bi bi-key prefix-icon"></i>
                    <input type="password" id="password" name="password" class="form-control"
                           placeholder="Enter password" required autocomplete="current-password">
                </div>
            </div>

            <button type="submit" class="btn-submit">
                <span>Sign In to Dashboard</span>
                <i class="bi bi-arrow-right"></i>
            </button>
        </form>

        <div class="login-footer">
            <a href="{{ url_for('index') }}" class="back-link">
                <i class="bi bi-arrow-left"></i>
                <span>Return to Home</span>
            </a>
            <div class="security-badge">
                <i class="bi bi-lock-fill"></i>
                <span>Backend Authorized Sessions Only</span>
            </div>
        </div>
    </div>
</body>
</html>
