<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thank You | Resumora</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        :root {
            --primary: #2563eb;
            --primary-hover: #1d4ed8;
            --bg-gray: #f8fafc;
            --text-main: #0f172a;
            --text-muted: #64748b;
            --success: #22c55e;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', sans-serif; }

        body {
            background-color: var(--bg-gray);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2rem;
        }

        .thank-you-card {
            background: white;
            max-width: 600px;
            width: 100%;
            padding: 3.5rem 2rem;
            border-radius: 1.5rem;
            box-shadow: 0 20px 40px rgba(0,0,0,0.05);
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 1.5rem;
        }

        .icon-box {
            width: 80px;
            height: 80px;
            background: #f0fdf4;
            color: var(--success);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 1rem;
        }

        h1 { font-size: 2.5rem; font-weight: 800; color: var(--text-main); }
        p { color: var(--text-muted); font-size: 1.1rem; line-height: 1.6; max-width: 450px; }

        .actions { display: flex; gap: 1rem; margin-top: 1rem; width: 100%; justify-content: center; }

        .btn {
            padding: 0.85rem 1.5rem;
            border-radius: 0.6rem;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            gap: 0.6rem;
            text-decoration: none;
            flex: 1;
            justify-content: center;
            max-width: 220px;
        }

        .btn-primary { background: var(--primary); color: white; border: none; }
        .btn-primary:hover { background: var(--primary-hover); transform: translateY(-2px); }
        .btn-outline { background: white; color: var(--text-main); border: 1px solid #e2e8f0; }
        .btn-outline:hover { background: #f8fafc; }

        .email-note {
            background: #eff6ff;
            color: #1e40af;
            padding: 1rem 1.5rem;
            border-radius: 0.75rem;
            font-size: 0.95rem;
            font-weight: 500;
            margin-top: 1rem;
            display: flex;
            align-items: center;
            gap: 0.75rem;
        }

        @media (max-width: 500px) {
            .actions { flex-direction: column; align-items: center; }
            .btn { width: 100%; max-width: none; }
        }
    </style>
</head>
<body>
    <div class="thank-you-card">
        <div class="icon-box">
            <i data-lucide="check-circle-2" style="width: 48px; height: 48px;"></i>
        </div>
        <h1>Success!</h1>
        <p>Your professional resume has been generated and is ready for your career journey.</p>
        
        <div class="email-note">
            <i data-lucide="mail"></i>
            A copy has been sent to your email address for safekeeping.
        </div>

        <!-- Feedback Section -->
        <div id="feedbackSection" style="width: 100%; border-top: 1px solid #e2e8f0; padding-top: 2rem; margin-top: 1rem;">
            <h3 style="margin-bottom: 1rem;">How was your experience?</h3>
            <div class="star-rating" style="display: flex; justify-content: center; gap: 0.5rem; margin-bottom: 1.5rem;">
                {% for i in range(1, 6) %}
                <i data-lucide="star" class="star-icon" data-value="{{ i }}" style="width: 32px; height: 32px; cursor: pointer; color: #cbd5e1; fill: none; transition: all 0.2s;"></i>
                {% endfor %}
            </div>
            <textarea id="feedbackComment" placeholder="What can we improve? (optional)" style="width: 100%; min-height: 100px; padding: 1rem; border: 1px solid #e2e8f0; border-radius: 0.75rem; font-size: 0.95rem; margin-bottom: 1rem; resize: vertical;"></textarea>
            <button id="submitFeedback" class="btn btn-primary" style="width: 100%; max-width: none;">Submit Feedback</button>
        </div>

        <div id="successMessage" style="display: none; color: var(--success); font-weight: 600;">
            <i data-lucide="check" style="display: inline; vertical-align: middle;"></i> Thank you for your feedback!
        </div>

        <div class="actions">
            <a href="/dashboard" class="btn btn-primary">
                <i data-lucide="layout-dashboard"></i> Back to Dashboard
            </a>
            <a href="/builder" class="btn btn-outline">
                <i data-lucide="plus"></i> Create Another
            </a>
        </div>
    </div>

    <script>
        lucide.createIcons();
        
        let selectedRating = 0;
        const stars = document.querySelectorAll('.star-icon');
        
        stars.forEach(star => {
            star.addEventListener('mouseover', () => highlightStars(star.dataset.value));
            star.addEventListener('mouseout', () => highlightStars(selectedRating));
            star.addEventListener('click', () => {
                selectedRating = star.dataset.value;
                highlightStars(selectedRating);
            });
        });

        function highlightStars(rating) {
            stars.forEach(s => {
                const val = parseInt(s.dataset.value);
                if (val <= rating) {
                    s.style.color = '#f59e0b';
                    s.style.fill = '#f59e0b';
                } else {
                    s.style.color = '#cbd5e1';
                    s.style.fill = 'none';
                }
            });
        }

        document.getElementById('submitFeedback').addEventListener('click', async () => {
            const comment = document.getElementById('feedbackComment').value;
            if (selectedRating === 0 && !comment) {
                alert('Please provide a rating or comment.');
                return;
            }

            try {
                const res = await fetch('/submit-feedback', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ rating: selectedRating, comment: comment })
                });

                if (res.ok) {
                    document.getElementById('feedbackSection').style.display = 'none';
                    document.getElementById('successMessage').style.display = 'block';
                }
            } catch (e) {
                console.error(e);
            }
        });
    </script>
</body>
</html>
